<style>
/* Layout: a phone-first studio app. Sticky top bar, scrolling content in one column, fixed tab bar at the bottom. */
:root {
  --bg: #f6f4f0;
  --surface: #ffffff;
  --surface-2: #eeebe5;
  --ink: #16181b;
  --muted: #676b72;
  --line: #e5e1d9;
  --accent: #8b5e34;
  --accent-ink: #ffffff;
  --good: #2f7a55;
  --shadow: 0 1px 2px rgba(22, 20, 16, .04), 0 8px 24px -14px rgba(22, 20, 16, .18);
  --serif: "Fraunces", Georgia, "Times New Roman", serif;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1012; --surface: #18191c; --surface-2: #222327; --ink: #f2efe9; --muted: #9c9fa6;
    --line: #2b2d32; --accent: #d4a373; --accent-ink: #1b1207; --good: #6cc496;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1012; --surface: #18191c; --surface-2: #222327; --ink: #f2efe9; --muted: #9c9fa6;
  --line: #2b2d32; --accent: #d4a373; --accent-ink: #1b1207; --good: #6cc496;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
h1, h2, h3, p { margin: 0; }
h1 { font: 500 38px/1.05 var(--serif); letter-spacing: -.02em; text-wrap: balance; }
h2 { font: 500 24px/1.2 var(--serif); letter-spacing: -.01em; text-wrap: balance; }
h3 { font: 600 16px/1.3 var(--sans); text-wrap: balance; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.eyebrow { font: 600 11px/1.4 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.code { font: 500 11px/1.4 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; }
.accent { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* frame */
.bar { position: sticky; top: 0; z-index: 8; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.barin { max-width: 640px; margin: 0 auto; height: 56px; display: flex; align-items: center; gap: 6px; padding: 0 max(10px, env(safe-area-inset-right, 0px)) 0 max(10px, env(safe-area-inset-left, 0px)); }
.bar .title { flex: 1; min-width: 0; font: 600 16px var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 6px; }
.iconbtn { width: 40px; height: 40px; border-radius: 12px; border: 0; background: transparent; color: var(--ink); display: grid; place-items: center; cursor: pointer; flex: none; }
.iconbtn:hover { background: var(--surface-2); }
.wrap { max-width: 640px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(112px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.view { display: grid; gap: 18px; padding-top: 20px; min-width: 0; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
.tabsin { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.tab { position: relative; border: 0; background: none; padding: 9px 2px 10px; display: grid; justify-items: center; gap: 3px; font: 500 11px var(--sans); color: var(--muted); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tab svg.i { width: 23px; height: 23px; }
.tab[aria-current="page"] { color: var(--accent); }
.badge { position: absolute; top: 5px; left: calc(50% + 5px); min-width: 18px; height: 18px; border-radius: 9px; padding: 0 5px; background: var(--accent); color: var(--accent-ink); font: 700 10px/18px var(--sans); }
.ainote { position: relative; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 8px; box-shadow: var(--shadow); }
.ainote h3 { font: 500 19px/1.3 var(--serif); padding-right: 28px; }
.ainote p { font-size: 15px; color: var(--muted); }
.ainote .x { position: absolute; top: 8px; right: 8px; }
.preview { background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 12px 10px 14px; display: flex; align-items: center; gap: 10px; font-size: 14px; }
.preview span { flex: 1; }

/* surfaces */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; box-shadow: var(--shadow); min-width: 0; }
.card ul, .card ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.note { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; font-size: 14px; }
.note b { color: var(--accent); }
.callout { border-left: 3px solid var(--accent); }
.sect { display: grid; gap: 10px; }
.sect > .eyebrow { padding-left: 2px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { height: 46px; padding: 0 20px; border-radius: 12px; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); font: 600 15px var(--sans); display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn.accent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn.sm { height: 36px; padding: 0 14px; font-size: 14px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .4; cursor: default; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.toast { font-size: 14px; color: var(--good); min-height: 1.4em; }
textarea.out, textarea.field { width: 100%; min-height: 120px; font: 14px/1.5 var(--sans); padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); resize: vertical; }
.field, .search { width: 100%; height: 46px; font: 16px var(--sans); padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.searchwrap { position: relative; }
.searchwrap svg { position: absolute; left: 14px; top: 13px; color: var(--muted); }
.searchwrap .search { padding-left: 42px; }
label.lbl { font: 600 13px var(--sans); color: var(--muted); display: block; margin-bottom: -6px; }
.guideimg { width: 100%; height: auto; border-radius: 12px; display: block; border: 1px solid var(--line); }

/* chips */
.scroller { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px; }
.scroller::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 500 14px var(--sans); cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.seg { display: flex; gap: 2px; padding: 3px; background: var(--surface-2); border-radius: 12px; overflow-x: auto; scrollbar-width: none; }
.seg button { flex: 1 0 auto; height: 34px; padding: 0 12px; border: 0; border-radius: 9px; background: none; font: 500 13px var(--sans); color: var(--muted); cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }

/* home */
.hello { display: flex; gap: 14px; align-items: center; }
.mono { width: 54px; height: 54px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--ink); color: var(--bg); font: 500 24px var(--serif); overflow: hidden; }
.mono img { width: 100%; height: 100%; object-fit: cover; }
.hero { position: relative; border-radius: 20px; overflow: hidden; min-height: 230px; display: grid; align-content: end; padding: 20px; color: #fff; background: #2a2622; text-align: left; border: 0; cursor: pointer; width: 100%; font: inherit; }
.hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.05) 10%, rgba(0,0,0,.35) 45%, rgba(0,0,0,.82)); }
.hero > * { position: relative; z-index: 1; }
.hero h2 { font-size: 28px; color: #fff; text-shadow: 0 1px 12px rgba(0,0,0,.35); }
.hero .eyebrow { color: rgba(255,255,255,.8); }
.hero .go { margin-top: 12px; justify-self: start; background: #fff; color: #16181b; border-radius: 999px; padding: 8px 16px; font: 600 14px var(--sans); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.stats div { padding: 14px 8px; text-align: center; }
.stats div + div { border-left: 1px solid var(--line); }
.stats b { display: block; font: 500 24px/1.1 var(--serif); }
.stats span { font-size: 12px; color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; cursor: pointer; display: grid; gap: 2px; align-content: start; box-shadow: var(--shadow); min-width: 0; }
.tiles > .tile:last-child:nth-child(odd) { grid-column: span 2; }
.tile .ic { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 13%, transparent); color: var(--accent); margin-bottom: 10px; }
.tile b { font: 600 15px/1.3 var(--sans); }
.tile span { font-size: 13px; line-height: 1.4; color: var(--muted); }
.steps { counter-reset: s; display: grid; gap: 12px; }
.steps li { list-style: none; display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; }
.steps li::before { counter-increment: s; content: counter(s); width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 600 13px var(--sans); }
.foot { text-align: center; font-size: 13px; color: var(--muted); padding-top: 8px; }

/* pose grid */
.pgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 12px; }
.pcell { position: relative; min-width: 0; }
.popen { display: grid; gap: 7px; width: 100%; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; }
.ph { aspect-ratio: 3 / 4; width: 100%; border-radius: 14px; overflow: hidden; background: var(--surface-2); position: relative; display: grid; place-items: center; }
.ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ph svg.sk { width: 50%; height: auto; }
.pcell .nm { font: 500 16px/1.25 var(--serif); }
.heart { position: absolute; top: 8px; right: 8px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: rgba(255,255,255,.94); color: #16181b; display: grid; place-items: center; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.18); }
.heart svg { width: 19px; height: 19px; }
.heart[aria-pressed="true"] { color: #d0453f; }
.heart[aria-pressed="true"] path { fill: currentColor; }
.sk * { stroke: var(--muted); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.sk circle { fill: var(--muted); stroke: none; }
.sk.after * { stroke: var(--accent); }
.sk.after circle { fill: var(--accent); }
.more { justify-self: center; }
@media (min-width: 540px) { .pgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

/* pose detail sheet */
.sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; overscroll-behavior: contain; }
.sheetin { max-width: 640px; margin: 0 auto; display: grid; gap: 12px; padding: calc(env(safe-area-inset-top, 0px) + 8px) max(16px, env(safe-area-inset-right, 0px)) calc(96px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheettop { display: flex; align-items: center; gap: 8px; }
.sheettop .code { flex: 1; text-align: center; }
.sheet .ph { width: min(100%, calc(60vh * .75)); justify-self: center; }
.sheet h2 { font-size: 30px; }
.cue { font-size: 18px; line-height: 1.5; }
.why { font-size: 15px; color: var(--muted); }
.avoid { font-size: 15px; }
.avoid b, .skip b { color: var(--accent); font-weight: 600; }
.sheetnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--bg); border-top: 1px solid var(--line); padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheetnav div { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.heartbig { height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; gap: 6px; font: 600 14px var(--sans); cursor: pointer; }
.heartbig svg { width: 18px; height: 18px; }
.heartbig[aria-pressed="true"] { color: #d0453f; border-color: currentColor; }
.heartbig[aria-pressed="true"] path { fill: currentColor; }

/* session mode */
.flowlist { display: grid; gap: 10px; }
.flow { display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px 10px 10px; cursor: pointer; box-shadow: var(--shadow); min-width: 0; }
.flow .ph { border-radius: 10px; }
.flow b { font: 500 17px/1.25 var(--serif); display: block; }
.flow .code { display: block; margin-bottom: 2px; }
.flow > svg { color: var(--muted); }
.flow.feature { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.flow.feature .code, .flow.feature > svg { color: color-mix(in srgb, var(--bg) 70%, transparent); }
.ghline { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-size: 14px; cursor: pointer; text-align: left; width: 100%; }
.ghline svg { color: #d08a2a; }
.step { display: grid; gap: 12px; }
.step .ph { width: min(100%, calc(52vh * .75)); justify-self: center; }
.step h2 { font-size: 30px; }
.progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); }
.stagebar { display: flex; gap: 6px; flex-wrap: wrap; }
.stagebar span { font: 500 12px var(--sans); padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.stagebar span.on { background: var(--accent); color: var(--accent-ink); }
.stepnav { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
.stepnav .btn { height: 54px; font-size: 16px; }

/* fixes */
.ba { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.fig { aspect-ratio: 3 / 4; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; position: relative; overflow: hidden; }
.fig img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.fig svg { width: 60%; }
.fig .tag { position: absolute; top: 8px; left: 8px; z-index: 1; font: 600 10px var(--sans); letter-spacing: .1em; text-transform: uppercase; padding: 4px 8px; border-radius: 999px; background: rgba(255,255,255,.92); color: #16181b; }
.fig.after .tag { background: var(--accent); color: var(--accent-ink); }

/* tables */
.tablewrap { overflow-x: auto; margin: 0 -18px; padding: 0 18px; }
table { border-collapse: collapse; width: 100%; min-width: 520px; font-size: 14px; }
th, td { text-align: left; vertical-align: top; padding: 10px; border-bottom: 1px solid var(--line); }
th { font: 600 11px var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
td:first-child { font-weight: 600; }
tr:last-child td { border-bottom: 0; }

/* wear */
.mood { display: grid; grid-template-columns: repeat(6, 1fr); grid-auto-rows: 58px; gap: 6px; }
.sw { border-radius: 10px; padding: 7px 9px; display: flex; flex-direction: column; justify-content: flex-end; font-size: 12px; line-height: 1.2; font-weight: 500; }
.sw:nth-child(1) { grid-column: span 3; grid-row: span 2; }
.sw:nth-child(n+2) { grid-column: span 3; }
.sw code { font: 10px var(--sans); opacity: .8; letter-spacing: .04em; }
.moodword { font: 500 24px/1.25 var(--serif); }

/* editable lists */
.edit { display: grid; gap: 8px; }
.edit .item { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; }
.edit input[type="text"] { width: 100%; min-width: 0; font: 15px var(--sans); padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
.edit input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); }
.x { border: 0; background: transparent; color: var(--muted); font-size: 20px; cursor: pointer; width: 32px; height: 32px; border-radius: 50%; }
.qn { font: 600 12px var(--sans); color: var(--accent); width: 22px; text-align: center; }
.qa { display: grid; gap: 6px; }
.qa label { font-weight: 600; font-size: 15px; }
.qa textarea { min-height: 70px; }

/* deck */
.deck { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.pcard { aspect-ratio: 2.5 / 3.5; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px; display: grid; grid-template-rows: auto 1fr auto; gap: 6px; cursor: pointer; text-align: left; box-shadow: var(--shadow); min-width: 0; }
.pcard .ph { aspect-ratio: auto; border-radius: 8px; }
.pcard .ph svg { width: 46%; }
.pcard b { font: 500 14px/1.2 var(--serif); padding: 0 4px 4px; }
.pcard .code { padding: 2px 4px 0; }
.lock { position: fixed; inset: 0; z-index: 20; background: #0d0e10; color: #f2efe9; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.lockcard { width: min(92vw, 420px); aspect-ratio: 9 / 19.5; max-height: calc(100% - 64px); margin-bottom: 48px; background: var(--surface); color: var(--ink); border-radius: 30px; padding: 24px 20px; display: grid; grid-template-rows: 1fr auto auto auto auto; gap: 10px; }
.lockcard .ph { aspect-ratio: auto; height: 100%; }
.lockcard h2 { font-size: 28px; }
.locknav { position: fixed; bottom: max(14px, env(safe-area-inset-bottom, 0px)); left: 0; right: 0; display: flex; justify-content: center; gap: 8px; }
.locknav .btn { background: #f2efe9; color: #16181b; border-color: #f2efe9; }

/* golden hour */
.ghgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ghcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 8px; box-shadow: var(--shadow); min-width: 0; }
.ghrow { display: grid; gap: 1px; }
.ghrow b { font: 500 18px/1.25 var(--serif); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.timeline { position: relative; height: 34px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
.timeline .now { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); }
.ticks { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 4px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }

/* lists with thumbs */
.mini { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; }

// ---------- Client message ----------
function clientMessage() {
  const a = store.get("answers", {}), qs = questions(), ps = picks.map(poseById).filter(Boolean);
  const name = (a.name || "").trim(), type = typeOf(a.type);
  let s = `Hi ${brand.name}! Here are my answers and pose picks.\n\nName: ${name || "(not given)"}\nSession: ${type ? type.label : "(not picked)"}\n`;
  if (a.date) s += `Date I'm hoping for: ${a.date}\n`;
  s += `\nQUESTIONS\n` + qs.map((q, i) => `${i + 1}. ${q}\n${(a["q" + i] || "").trim() || "-"}`).join("\n\n");
  s += `\n\nMY POSE PICKS (${ps.length})\n` + (ps.length ? ps.map(p => `${key(p)} ${p.name}`).join("\n") : "-");
  return s + "\n\nSent from Pose Pocket";
}
function parseMessage(txt) {
  const get = re => ((txt.match(re) || [])[1] || "").trim();
  const ids = [];
  for (const m of txt.matchAll(/\b([A-Z]{2,4})-(\d{2})\b/g)) { const t = typeByCode(m[1]); if (!t) continue; const p = POSES.find(x => x.who === t.id && x.frame === t.code + " " + m[2]); if (p && !ids.includes(p.id)) ids.push(p.id); }
  return { name: get(/^Name:\s*(.+)$/m) || "Client", session: get(/^Session:\s*(.+)$/m), date: get(/^Date I'm hoping for:\s*(.+)$/m), ids, text: txt.trim().slice(0, 20000), at: Date.now() };
}

let saveTimer = null;
function shareSettings() {
  if (!db || !owner) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    db.doc("settings/studio").set({ name: brand.name, color: brand.color, logo: brand.logo, email: brand.email || "", phone: brand.phone || "", questions: store.get("questions", QUESTIONS), updated: Date.now() }).catch(() => {});
  }, 900);
}
async function loadShared() {
  if (!db) return;
  try {
    const s = await db.doc("settings/studio").get();
    const v = s.exists ? s.data() : null;
    if (!v) { if (owner) shareSettings(); return; }
    shared = v;
    const fromDb = { name: v.name || BRAND_DEFAULT.name, color: v.color || "", logo: v.logo || "", email: v.email || "", phone: v.phone || "" };
    if (owner) { brand = { ...brand, ...fromDb }; store.set("brand", brand); if (Array.isArray(v.questions)) store.set("questions", v.questions); }
    else brand = fromDb;
    applyBrand(); render();
  } catch (e) {}
}
async function inboxLoad() {
  if (db && owner) {
    try { const q = await db.collection("inbox").orderBy("at", "desc").limit(100).get(); state.inbox = q.docs.map(d => ({ id: d.id, ...d.data() })); state.inboxWhere = "app"; return; } catch (e) {}
  }
  state.inbox = store.get("inbox", []); state.inboxWhere = "browser";
}
async function inboxAdd(entry) {
  if (state.inboxWhere === "app") { await db.collection("inbox").add(entry); return inboxLoad(); }
  const l = store.get("inbox", []); l.unshift({ id: "b" + Date.now(), ...entry }); store.set("inbox", l); state.inbox = l;
}
async function inboxDelete(id) {
  if (state.inboxWhere === "app") { await db.doc("inbox/" + id).delete(); return inboxLoad(); }
  const l = store.get("inbox", []).filter(x => x.id !== id); store.set("inbox", l); state.inbox = l;
}

const CLIENT_OK = ["home", "poses", "wear", "questions", "picks"];
const viewDef = v => (clientMode && CLIENT[v]) || VIEWS[v];

function lum(hex) { const n = parseInt(hex.slice(1), 16); return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255; }
let lastPrompt = "";
function randomPrompt() { const l = PROMPTS[state.ptype]; let n; do { n = l[Math.floor(Math.random() * l.length)]; } while (l.length > 1 && n === lastPrompt); return (lastPrompt = n); }

function copyText(kind) {
  if (kind === "picks") {
    const ps = picks.map(poseById).filter(Boolean);
    return ps.length ? `Pose picks:\n` + TYPES.map(t => { const g = ps.filter(p => p.who === t.id); return g.length ? `\n${t.label}\n` + g.map(p => `- ${key(p)} ${p.name}`).join("\n") : ""; }).join("") : "";
  }
  if (kind === "client") return clientMessage();
  if (kind === "questions") return `${brand.name}: before your session\n\n` + questions().map((q, i) => `${i + 1}. ${q}\n`).join("\n");
  if (kind === "checklist") { const done = store.get("checked", {}); return Object.entries(store.get("checklist", CHECKLIST)).map(([g, it]) => `${g}\n` + it.map((x, i) => `[${done[g + "|" + i] ? "x" : " "}] ${x}`).join("\n")).join("\n\n"); }
  if (kind === "wear") { const w = WEAR.find(x => x.type === state.wearType) || WEAR[0]; return `${brand.name}: What to wear for ${typeOf(w.type).label}\n\nMood: ${w.mood}\nColors: ${w.palette.map(([n, h]) => `${n} ${h}`).join(", ")}\nFabrics: ${w.fabrics}\n\nOutfit ideas:\n${w.pairs.map(x => "- " + x).join("\n")}\n\nSkip: ${w.avoid}`; }
  return "";
}

function toast(msg) { const t = document.getElementById("toast"); if (t) t.textContent = msg; }

// ---------- Navigation ----------
let view = "home";
function tabsHtml() {
  const t = (v, icon, label, badge) => `<button class="tab" data-go="${v}" ${view === v ? 'aria-current="page"' : ""}>${ic(icon)}<span>${label}</span>${badge ? `<span class="badge">${badge}</span>` : ""}</button>`;
  return clientMode
    ? t("home", "home", "Home") + t("poses", "grid", "Poses") + t("wear", "shirt", "Wear") + t("questions", "clip", "Questions") + t("picks", "send", "Send", picks.length)
    : t("home", "home", "Home") + t("poses", "grid", "Poses") + t("session", "play", "Session") + t("golden", "sun", "Golden hour") + t("picks", "heart", "Picks", picks.length);
}
function go(v, keepScroll) {
  if (!VIEWS[v] || (clientMode && !CLIENT_OK.includes(v))) v = "home";
  view = v; state.sheet = null;
  render();
  if (!keepScroll) window.scrollTo(0, 0);
  const h = "#" + (clientMode && !previewing ? "client/" : "") + v;
  if (location.hash !== h) { try { history.replaceState(null, "", h); } catch (e) {} }
}
function render() {
  const def = viewDef(view);
  document.getElementById("barTitle").textContent = view === "home" ? brand.name : def.title;
  document.getElementById("homeBtn").hidden = view === "home";
  document.getElementById("tabs").innerHTML = tabsHtml();
  const banner = previewing ? `<div class="preview">${ic("link")}<span>Client preview</span><button class="btn sm" style="background:var(--bg);color:var(--ink)" data-endpreview>Exit</button></div>` : "";
  document.getElementById("app").innerHTML = `<div class="view">${banner}${def.render()}</div>` + (state.lock != null ? lockHtml() : "") + (state.sheet ? sheetHtml() : "");
  document.body.style.overflow = state.lock != null || state.sheet ? "hidden" : "";
}
function lockHtml() {
  const p = DECK[state.lock];
  return `<div class="lock" role="dialog" aria-label="Pose card ${state.lock + 1}"><div class="lockcard">
    ${ph(p, false)}

    <div class="locknav"><button class="btn" data-lockby="-1">Prev</button><button class="btn" data-lockclose>Close</button><button class="btn" data-lockby="1">Next</button></div></div>`;
}
function sheetHtml() {
  const ids = lists[state.sheet.list] || [state.sheet.id];
  let i = ids.indexOf(state.sheet.id); if (i < 0) i = 0;
  const p = poseById(ids[i]), on = picks.includes(p.id);
  return `<div class="sheet" role="dialog" aria-label="${esc(p.name)}"><div class="sheetin">
      <div class="sheettop"><button class="iconbtn" data-sheetclose aria-label="Close">${ic("close")}</button><span class="code">${i + 1} of ${ids.length}</span><button class="heartbig" data-heart="${p.id}" aria-pressed="${on}">${heartPath}${on ? "Saved" : "Save"}</button></div>
      ${ph(p, false)}
      <span class="code">${p.frame} · ${esc(typeOf(p.who).label)}${p.tag ? " · " + esc(p.tag) : ""}</span>
      <h2>${esc(p.name)}</h2>
      <p class="cue">${esc(p.cue)}</p>
      <p class="why">${esc(p.why)}</p>
      <p class="avoid"><b>Skip:</b> ${esc(p.avoid)}</p>
    </div>
    <div class="sheetnav"><div><button class="btn ghost" data-sheetby="-1" ${i === 0 ? "disabled" : ""}>Previous</button><button class="btn" data-sheetby="1" ${i + 1 >= ids.length ? "disabled" : ""}>Next</button></div></div></div>`;
}
function sheetStep(n) {
  const ids = lists[state.sheet.list] || []; const i = ids.indexOf(state.sheet.id) + n;
  if (i >= 0 && i < ids.length) { state.sheet.id = ids[i]; render(); document.querySelector(".sheet")?.scrollTo(0, 0); }
}

document.getElementById("homeBtn").addEventListener("click", () => { state.lock = null; if (view === "session" && state.flow) { state.flow = null; return render(); } go("home"); });
document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b) { if (b.dataset.go === "session") state.flow = null; go(b.dataset.go); } });

const app = document.getElementById("app");
app.addEventListener("click", e => {
  const d = e.target.closest("button")?.dataset; if (!d) return;
  if (d.go) return go(d.go);
  if (d.open) { state.sheet = { id: d.open, list: d.list }; return render(); }
  if (d.sheetclose !== undefined) { state.sheet = null; return render(); }
  if (d.sheetby) return sheetStep(Number(d.sheetby));
  if (d.type) { state.type = d.type; state.tag = "All"; state.limit = 30; return render(); }
  if (d.tag) { state.tag = d.tag; state.limit = 30; return render(); }
  if (d.more !== undefined) { state.limit += 30; return render(); }
  if (d.heart) { const id = d.heart; picks = picks.includes(id) ? picks.filter(x => x !== id) : [...picks, id]; store.set("picks", picks); return render(); }
  if (d.flow !== undefined) { state.flow = d.flow || null; state.step = 0; if (state.flow) requestWake(); if (view !== "session") return go("session"); render(); return window.scrollTo(0, 0); }
  if (d.shoot) { const en = state.inbox.find(x => x.id === d.shoot); state.custom = { name: en.name + "'s picks", ids: en.ids }; state.flow = "custom"; state.step = 0; requestWake(); return go("session"); }
  if (d.stepby) { state.step = Math.max(0, state.step + Number(d.stepby)); render(); return window.scrollTo(0, 0); }
  if (d.gear) { state.gear = d.gear; return render(); }
  if (d.area) { state.fixArea = d.area; return render(); }
  if (d.ptype) { state.ptype = d.ptype; return render(); }
  if (d.nextprompt !== undefined) { document.getElementById("promptText").textContent = randomPrompt(); return; }
  if (d.wear) { state.wearType = d.wear; return render(); }
  if (d.card) { state.lock = Number(d.card); requestWake(); return render(); }
  if (d.lockby) { state.lock = (state.lock + Number(d.lockby) + DECK.length) % DECK.length; return render(); }
  if (d.lockclose !== undefined) { state.lock = null; return render(); }
  if (d.clearpicks !== undefined) { picks = []; store.set("picks", picks); render(); return toast("Cleared your picks."); }
  if (d.addq !== undefined) { const qs = store.get("questions", QUESTIONS); qs.push(""); store.set("questions", qs); render(); return document.getElementById("q" + (qs.length - 1))?.focus(); }
  if (d.delq) { const qs = store.get("questions", QUESTIONS); qs.splice(Number(d.delq), 1); store.set("questions", qs); shareSettings(); return render(); }
  if (d.resetq !== undefined) { store.set("questions", QUESTIONS); shareSettings(); render(); return toast("Back to the default questions."); }
  if (d.addc) { const cl = store.get("checklist", CHECKLIST); cl[d.addc].push(""); store.set("checklist", cl); return render(); }
  if (d.delc) { const cl = store.get("checklist", CHECKLIST); cl[d.delc].splice(Number(d.ci), 1); store.set("checklist", cl); store.set("checked", {}); return render(); }
  if (d.resetc !== undefined) { store.set("checked", {}); return render(); }
  if (d.resetcl !== undefined) { store.set("checklist", CHECKLIST); store.set("checked", {}); return render(); }
  if (d.resetcolor !== undefined) { brand.color = ""; store.set("brand", brand); applyBrand(); shareSettings(); return render(); }
  if (d.nologo !== undefined) { brand.logo = ""; store.set("brand", brand); shareSettings(); return render(); }
  if (d.ainote !== undefined) { store.set("aiNoteSeen", true); return render(); }
  if (d.ainoteshow !== undefined) { store.set("aiNoteSeen", false); render(); return window.scrollTo(0, 0); }
  if (d.copylink) { navigator.clipboard.writeText(d.copylink).then(() => toast("Copied the client link.")).catch(() => toast("Select the link above and copy it.")); return; }
  if (d.preview !== undefined) { clientMode = true; previewing = true; return go("home"); }
  if (d.endpreview !== undefined) { clientMode = false; previewing = false; return go("clientlink"); }
  if (d.pro !== undefined) { store.set("mode", "pro"); clientMode = false; previewing = false; return go("home"); }
  if (d.geo !== undefined) {
    if (!navigator.geolocation) return toast("Location isn't available here.");
    toast("Finding you…");
    navigator.geolocation.getCurrentPosition(pos => {
      store.set("ghLoc", { name: "My location", lat: +pos.coords.latitude.toFixed(3), lon: +pos.coords.longitude.toFixed(3), tz: Intl.DateTimeFormat().resolvedOptions().timeZone });
      render();
    }, () => toast("Couldn't get your location. Pick a city instead."), { timeout: 10000 });
    return;
  }
  if (d.inboxadd !== undefined) {
    const txt = document.getElementById("inboxPaste").value;
    if (!txt.trim()) return toast("Paste a message first.");
    const en = parseMessage(txt);
    inboxAdd(en).then(() => { render(); toast(`Added ${en.name} with ${en.ids.length} picks.`); }).catch(() => toast("Couldn't save that. Try again."));
    return;
  }
  if (d.inboxdel) { if (confirm("Delete this message?")) inboxDelete(d.inboxdel).then(render).catch(() => toast("Couldn't delete that.")); return; }
  if (d.share !== undefined) { navigator.share({ title: `My session details for ${brand.name}`, text: clientMessage() }).catch(() => {}); return; }
  if (d.copy) {
    const txt = copyText(d.copy);
    if (!txt) return toast("Pick at least one pose first.");
    navigator.clipboard.writeText(txt).then(() => toast(d.copy === "client" ? `Copied. Paste it into an email or text to ${brand.name}.` : "Copied. Paste it into a text, email or Canva.")).catch(() => {
      const ta = document.createElement("textarea"); ta.className = "out"; ta.value = txt; ta.readOnly = true;
      document.getElementById("toast").replaceWith(ta); ta.select();
    });
  }
});
app.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "poseSearch") { state.q = el.value; state.limit = 30; const pos = el.selectionStart; render(); const s = document.getElementById("poseSearch"); s.focus(); s.setSelectionRange(pos, pos); return; }
  if (el.dataset.q !== undefined) { const qs = store.get("questions", QUESTIONS); qs[Number(el.dataset.q)] = el.value; store.set("questions", qs); shareSettings(); }
  if (el.dataset.citem) { const cl = store.get("checklist", CHECKLIST); cl[el.dataset.citem][Number(el.dataset.ci)] = el.value; store.set("checklist", cl); }
  if (el.dataset.ans) { const a = store.get("answers", {}); a[el.dataset.ans] = el.value; store.set("answers", a); }
  if (el.id === "bName") { brand.name = el.value || "Your studio"; store.set("brand", brand); document.getElementById("barTitle").textContent = "Your studio"; shareSettings(); }
  if (el.id === "bEmail") { brand.email = el.value.trim(); store.set("brand", brand); shareSettings(); }
  if (el.id === "bPhone") { brand.phone = el.value.trim(); store.set("brand", brand); shareSettings(); }
  if (el.id === "bColor") { brand.color = el.value; store.set("brand", brand); applyBrand(); shareSettings(); }
});
app.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.check) { const done = store.get("checked", {}); done[el.dataset.check] = el.checked; store.set("checked", done); }
  if (el.id === "ghCity" && el.value !== "custom") { const c = CITIES[Number(el.value)]; store.set("ghLoc", { name: c[0], lat: c[1], lon: c[2], tz: c[3] }); return render(); }
  if (el.id === "ghDate") { state.ghDate = el.value; return render(); }
  if (el.id === "bLogo" && el.files[0]) {
    // Shrink the logo so it fits in storage.
    const img = new Image(), r = new FileReader();
    r.onload = () => { img.onload = () => { const c = document.createElement("canvas"), s = 160 / Math.max(img.width, img.height); c.width = img.width * s; c.height = img.height * s; c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); brand.logo = c.toDataURL("image/png"); if (store.set("brand", brand)) { shareSettings(); render(); } else toast("This browser won't save the logo. Try a smaller image."); }; img.src = r.result; };
    r.readAsDataURL(el.files[0]);
  }
});
document.addEventListener("keydown", e => {
  if (e.target.matches && e.target.matches("input, textarea, select")) return;
  if (state.sheet) { if (e.key === "ArrowRight") sheetStep(1); if (e.key === "ArrowLeft") sheetStep(-1); if (e.key === "Escape") { state.sheet = null; render(); } }
  else if (state.lock != null) { if (e.key === "ArrowRight") { state.lock = (state.lock + 1) % DECK.length; render(); } if (e.key === "ArrowLeft") { state.lock = (state.lock + DECK.length - 1) % DECK.length; render(); } if (e.key === "Escape") { state.lock = null; render(); } }
  else if (view === "session" && state.flow) { if (e.key === "ArrowRight") { state.step++; render(); } if (e.key === "ArrowLeft" && state.step > 0) { state.step--; render(); } }
});
// Keep the screen on while using cards or Session Mode, where the browser allows it.
function requestWake() { try { navigator.wakeLock?.request("screen").catch(() => {}); } catch (e) {} }

function fromHash() {
  const h = location.hash.slice(1);
  if (h === "client" || h.startsWith("client/")) return { client: true, v: h.split("/")[1] || "home" };
  return { client: false, v: h };
}
window.addEventListener("hashchange", () => { const r = fromHash(); if (r.client && !clientMode) clientMode = true; if (VIEWS[r.v] && r.v !== view) go(r.v); });

// Theme: follow the device, or a light/dark choice remembered in this browser.
const THEMES = { auto: ["sun", "Theme: matches your device. Tap for light."], light: ["sun", "Theme: light. Tap for dark."], dark: ["moon", "Theme: dark. Tap to match your device."] };
ICON.moon = '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>';
ICON.auto = '<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" fill="currentColor"/>';
function applyTheme() {
  const t = store.get("theme", "auto");
  if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t);
  const b = document.getElementById("themeBtn");
  b.innerHTML = ic(t === "auto" ? "auto" : THEMES[t][0]); b.setAttribute("aria-label", THEMES[t][1]); b.title = THEMES[t][1];
}
document.getElementById("themeBtn").addEventListener("click", () => { const order = ["auto", "light", "dark"]; store.set("theme", order[(order.indexOf(store.get("theme", "auto")) + 1) % 3]); applyTheme(); });
applyTheme();

applyBrand();
const start = fromHash();
const forcedClient = start.client;
clientMode = forcedClient;
go(VIEWS[start.v] ? start.v : "home");

// Who's viewing: the photographer sees the full app; anyone else sees the client version.
(async () => {
  if (!window.claude || !window.claude.use) return;
  const [u, d] = await Promise.all([claude.use("user").catch(() => null), claude.use("db").catch(() => null)]);
  db = d;
  owner = u ? await u.isOwner().catch(() => false) : false;
  if (!owner && !forcedClient && store.get("mode", "") !== "pro") { clientMode = true; go(CLIENT_OK.includes(view) ? view : "home", true); }
  await loadShared();
  if (view === "inbox") { state.inbox = null; render(); }
})();
</script>
