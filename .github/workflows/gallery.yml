name: Update gallery

# Drop photos into images/portrait, fashion, event or maternity (GitHub's
# "Add file > Upload files" works). This resizes them and refreshes the
# "View more" list on the site automatically.
on:
  push:
    branches: [main]
    paths:
      - "images/portrait/**"
      - "images/fashion/**"
      - "images/event/**"
      - "images/maternity/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python scripts/build_gallery.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A images portrait.html fashion.html event.html maternity.html
          git diff --cached --quiet || (git commit -m "Update gallery photos" && git push)
